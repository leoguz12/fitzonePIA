# Plantilla "Blueprint" para desplegar en Render (https://render.com): Web Service (Docker) + PostgreSQL.
# Revisa los nombres de planes en tu cuenta de Render antes de usarla.
services:
  - type: web
    name: fitzone-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitzone-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: TOLERANCIA_MINUTOS
        value: "10"
      - key: LIMITE_CANCELACION_HORAS
        value: "2"

databases:
  - name: fitzone-db
    databaseName: fitzone
    plan: free
